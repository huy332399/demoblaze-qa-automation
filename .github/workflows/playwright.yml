name: Playwright Tests CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_grep:
        description: 'Test tag filter (e.g. @smoke, @regression, @api, @cart, @login)'
        required: false
        default: ''

jobs:
  test:
    name: Run Playwright Tests (${{ matrix.project }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install system dependencies for Playwright
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Execute Playwright Tests
        run: |
          if [ -n "${{ github.event.inputs.test_grep }}" ]; then
            npx playwright test --project=${{ matrix.project }} --grep "${{ github.event.inputs.test_grep }}"
          else
            npx playwright test --project=${{ matrix.project }}
          fi
        env:
          CI: true
          BASE_URL: https://www.demoblaze.com

      - name: Upload Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
            docs/Test_Cases_DemoBlaze_Login_Cart.xlsx
          retention-days: 14
